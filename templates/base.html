<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Horse Breeding Helper</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <div class="brand-row">
          <h1 class="brand">Horse Breeding Helper</h1>
          <nav class="main-nav">
            <a href="/">Home</a>
            <a href="/add">Add Horse</a>
            <a href="/export">Download CSV</a>
          </nav>
        </div>
      </div>
    </header>

    <main class="container">
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="flash">{% for m in messages %}{{ m }}<br>{% endfor %}</div>
        {% endif %}
      {% endwith %}

      {% block content %}{% endblock %}
    </main>
  </body>
</html>
